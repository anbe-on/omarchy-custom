force_keyboard_focus = true                                                 # forces keyboard forcus to stay in Walker
selection_wrap = true                                                       # wrap list if at bottom or top
theme = "omarchy-default"                                                   # theme to use
additional_theme_location = "~/.local/share/omarchy/default/walker/themes/"
hide_action_hints = true                                                    # globally hide the action hints

[placeholders]
"default" = {
  input = "cmd:sh -c \"echo $(date +'%H:%M %a %d %b') $(omarchy-battery-remaining-time) $(cat /sys/class/power_supply/BAT1/capacity) $(grep -q Charging /sys/class/power_supply/BAT1/status && echo 󰂄 || echo 󰁹) $(( $(cat /sys/devices/platform/coretemp.0/hwmon/hwmon5/temp1_input) / 1000 ))󰔄\"",
  list = "No Results"
}

[keybinds]
quick_activate = []
next = ["Down", "ctrl n"]
previous = ["Up", "ctrl p"]

[providers.actions]
desktopapplications = [
  { action = "pin", bind = "ctrl shift p", after = "AsyncReload" },
  { action = "unpin", bind = "ctrl shift p", after = "AsyncReload" },
  { action = "pinup", bind = "ctrl shift n", after = "AsyncReload" },
]

[columns]
symbols = 1 # providers to be queried by default

[providers]
max_results = 256 # 256 should be enough for everyone
default = [
  "desktopapplications",
]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[emergencies]]
text = "Restart Walker"
command = "omarchy-restart-walker"
