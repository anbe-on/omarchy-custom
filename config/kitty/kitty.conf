include ~/.config/omarchy/current/theme/kitty.conf

# env
term xterm-256color

# Font
font_family      GeistMono NFM
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window
window_padding_width    4
hide_window_decorations yes
background_opacity      0.88
dynamic_background_opacity yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# cursor type
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor

# Mouse scrolling
# Note: Kitty's default wheel_scroll_multiplier is 5.0.
# Setting this to 0.95 will be significantly slower than Kitty's default.
wheel_scroll_multiplier 0.95
touch_scroll_multiplier 0.95
